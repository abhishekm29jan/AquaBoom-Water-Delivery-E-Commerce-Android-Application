# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Run tasks in parallel
org.gradle.parallel=true

# Enables Gradle Build Cache
org.gradle.caching=true

# Enables Configuration Cache
org.gradle.configuration-cache=true

# AndroidX package structure
android.useAndroidX=true

# Disabling Jetifier saves time
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Restoring some original settings that might be needed for this specific AGP/Kotlin version
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
